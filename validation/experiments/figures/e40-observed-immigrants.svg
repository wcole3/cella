<title id="e40-title">E40 observed-perimeter immigrants: per-seed change and per-day IoU</title>
<desc id="e40-desc">Top: dot strip per fire, the change in mean forecast IoU from the E33 twin for E40 (immigrants seeded from the observed perimeter), one dot per seed, against the E33 noise band. Bottom: per-day consensus IoU for Bear and Ferguson, the two fires the prediction named as movers, comparing E40 and E33 (both the 5-seed mean) with the Circle null.</desc>
