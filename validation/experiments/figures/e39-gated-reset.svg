<title id="e39-title">E39 gated immigrant reset: change per seed vs E38</title>
<desc id="e39-desc">Dot strip per fire, one seed at a time: the change in mean forecast IoU from the E33 twin for the plain E38 reset (muted) and the area-ratio-gated E39 reset (accent), joined by a thin line so the same seed's movement from one to the other reads at a glance, against the E33 noise band.</desc>
