<text x="132" y="416" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" font-weight="400" text-anchor="start" >round</text>
<circle cx="198" cy="412" r="6" fill="#eb6c36"/>
<text x="210" y="416" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" font-weight="400" text-anchor="start" >the ensemble becomes the product</text>
