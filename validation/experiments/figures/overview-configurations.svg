<line x1="284" y1="200" x2="924" y2="200" stroke="#2d3142" stroke-width="1"/>
<line x1="252" y1="208" x2="264" y2="192" stroke="#2d3142" stroke-width="1"/>
<line x1="264" y1="208" x2="276" y2="192" stroke="#2d3142" stroke-width="1"/>
<text x="270.0" y="228" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" font-weight="400" text-anchor="middle" letter-spacing="0.10em">17 DAYS</text>
