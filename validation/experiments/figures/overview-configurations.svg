<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 436" role="img" aria-labelledby="ovc-title ovc-desc">
<title id="ovc-title">Rounds and working configurations, 14 August to 5 September 2026</title>
<desc id="ovc-desc">Timeline of the baseline and five experiment rounds with the working configuration after each, an axis break over the 17-day gap, and brackets showing which rounds use single-run mean IoU and which use ensemble forecast consensus IoU.</desc>
<defs><style>@import url('https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style></defs>
