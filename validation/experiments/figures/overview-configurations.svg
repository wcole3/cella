<text x="884" y="220" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" font-weight="400" text-anchor="middle" letter-spacing="0.10em">SEP 5</text>
<text x="500" y="244" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" font-weight="400" text-anchor="middle" letter-spacing="0.14em">2026</text>
<circle cx="64" cy="200" r="4" fill="#2d3142"/>
<line x1="64" y1="206" x2="64" y2="256" stroke="#7a8399" stroke-width="1"/>
