<text x="324" y="292" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" font-weight="400" text-anchor="middle" >wind audit: no bug, input inert</text>
<text x="324" y="306" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" font-weight="400" text-anchor="middle" >wind_from_deg; no recipe change</text>
<circle cx="464" cy="200" r="4" fill="#2d3142"/>
<line x1="464" y1="194" x2="464" y2="156" stroke="#7a8399" stroke-width="1"/>
<text x="464" y="102" fill="#2d3142" font-size="11" font-family="'Geist', sans-serif" font-weight="600" text-anchor="middle" >Round 3 · E14–E23</text>
<text x="464" y="118" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" font-weight="400" text-anchor="middle" >per fire: p0 ×4, station wind,</text>
<text x="464" y="132" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" font-weight="400" text-anchor="middle" >moisture, decay τ 5 d (E17)</text>
<text x="464" y="146" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" font-weight="400" text-anchor="middle" >global: E20 transfer recipe</text>
<circle cx="744" cy="200" r="6" fill="#eb6c36"/>
<line x1="744" y1="208" x2="744" y2="256" stroke="#7a8399" stroke-width="1"/>
<text x="744" y="276" fill="#2d3142" font-size="11" font-family="'Geist', sans-serif" font-weight="600" text-anchor="middle" >Round 4 · E24–E28</text>
<text x="744" y="292" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" font-weight="400" text-anchor="middle" >32-member filter, β 10, σ 0.2,</text>
<text x="744" y="306" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" font-weight="400" text-anchor="middle" >immigrants 0.2; containment</text>
<text x="744" y="320" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" font-weight="400" text-anchor="middle" >operator on, decay off</text>
<circle cx="884" cy="200" r="4" fill="#2d3142"/>
<line x1="884" y1="194" x2="884" y2="156" stroke="#7a8399" stroke-width="1"/>
<text x="924" y="102" fill="#2d3142" font-size="11" font-family="'Geist', sans-serif" font-weight="600" text-anchor="end" >E31 + Round 5 · E32–E38</text>
<text x="924" y="118" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" font-weight="400" text-anchor="end" >generic explore engine (E31)</text>
<text x="924" y="132" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" font-weight="400" text-anchor="end" >same configuration;</text>
<text x="924" y="146" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" font-weight="400" text-anchor="end" >immigrant_reset option</text>
<line x1="64" y1="352" x2="464" y2="352" stroke="#4f5d75" stroke-width="1"/>
<line x1="64" y1="346" x2="64" y2="352" stroke="#4f5d75" stroke-width="1"/>
<line x1="464" y1="346" x2="464" y2="352" stroke="#4f5d75" stroke-width="1"/>
<text x="264.0" y="368" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" font-weight="400" text-anchor="middle" letter-spacing="0.10em">SINGLE RUN · MEAN IoU</text>
<line x1="744" y1="352" x2="884" y2="352" stroke="#4f5d75" stroke-width="1"/>
<line x1="744" y1="346" x2="744" y2="352" stroke="#4f5d75" stroke-width="1"/>
<line x1="884" y1="346" x2="884" y2="352" stroke="#4f5d75" stroke-width="1"/>
<text x="814.0" y="368" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" font-weight="400" text-anchor="middle" letter-spacing="0.10em">ENSEMBLE FORECAST · CONSENSUS IoU + BRIER</text>
<line x1="32" y1="400" x2="968" y2="400" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
