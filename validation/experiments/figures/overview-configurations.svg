<line x1="744" y1="196" x2="744" y2="204" stroke="#2d3142" stroke-width="1"/>
<text x="744" y="220" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" font-weight="400" text-anchor="middle" letter-spacing="0.10em">SEP 4</text>
