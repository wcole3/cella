<text x="40" y="292" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" font-weight="400" text-anchor="start" >textbook p0 0.58, dur 5</text>
<text x="40" y="306" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" font-weight="400" text-anchor="start" >loses to the Circle on 5 of 6</text>
<circle cx="204" cy="200" r="4" fill="#2d3142"/>
<line x1="204" y1="194" x2="204" y2="156" stroke="#7a8399" stroke-width="1"/>
