<text x="204" y="132" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" font-weight="400" text-anchor="middle" >per fire: E1 (p0, dur) + temperature</text>
<text x="204" y="146" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" font-weight="400" text-anchor="middle" >global: p0 0.22, dur 5 + temperature</text>
