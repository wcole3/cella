<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" role="img" aria-labelledby="e30a-title e30a-desc">
<title id="e30a-title">E30a arrival-time kernel: elongation vs. size</title>
<desc id="e30a-desc">Four panels, one per wind speed (0, 2, 5, 8 m/s), each plotting E12's elongation measure against the burned cell count (2000, 5000, 10000, 20000) for a point ignition upwind on a 900x300 uniform grid, one line for the Bernoulli spread rule and one for the arrival-time rule (exponential wind law), mean over 3 seeds with a min-max band; hollow dashed points mark boundary contact.</desc>
