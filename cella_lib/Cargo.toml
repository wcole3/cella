[package]
name = "cella_lib"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = { version = "0.8", features = ["small_rng"] }
thiserror = "1"
lasso2 = { version = "0.8.2", features = ["multi-threaded", "serialize"] }
memoize = "0.6.0"
rayon = "1"
