[package]
name = "cella_lib"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
lasso2 = { version = "0.8.2", features = ["multi-threaded", "serialize"] }
memoize = "0.6.0"
rayon = "1"
typetag = "0.2.23"

# This crate is its own build root when tests/benches run from cella_lib/
# (it is not a member of the root package's workspace), so the release profile
# is mirrored here and in the root Cargo.toml — keep the two in sync.
[profile.release]
lto = "thin"
codegen-units = 1

# Read-only bench-profile study (docs/performance.md, "Bench profile study").
# Inherits release; fat LTO and panic=abort layer on top of it here. The
# target-cpu=native variant is applied at build time via RUSTFLAGS (see that
# section for the exact command), not baked into this profile, so it can be
# toggled per invocation without editing this file. Mirrored in the root
# Cargo.toml — keep the two in sync, same rule as [profile.release].
#
# Named `bench-study`, not Cargo's built-in `bench` profile: the built-in
# name defaults to `target/release/` (no separate `target/bench/`), so a
# `cargo build --profile bench --example wildfire_smc` could fingerprint-
# match and silently reuse or overwrite the plain-release
# `cella_lib/target/release/examples/wildfire_smc` every experiment runner
# calls (`docs/performance.md`, "Bench profile study" -- "Two build-system
# details discovered while setting this up"). A custom name gets its own
# `target/bench-study/` directory instead, closing that risk; nothing about
# this profile's settings or the study's own numbers changed.
[profile.bench-study]
inherits = "release"
lto = "fat"
panic = "abort"
