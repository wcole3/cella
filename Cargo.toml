[package]
name = "cella"
version = "0.1.0"
edition = "2024"

[dependencies]
cella_lib = { path = "./cella_lib" }
eframe = { version = "0.35.0", default-features = true }
egui = "0.35.0"
egui_plot = "0.36.0"
rfd = "0.17"
gif = "0.14"
serde = "1"
serde_json = "1"
env_logger = "0.11"
lasso2 = { version = "0.8.2", features = ["multi-threaded", "serialize"] }

# cella_lib is a separate build root (not a workspace member), so this profile
# is mirrored in cella_lib/Cargo.toml — keep the two in sync.
[profile.release]
lto = "thin"
codegen-units = 1
