[package]
name = "cella"
version = "0.1.0"
edition = "2024"

[dependencies]
cella_lib = { path = "./cella_lib" }
eframe = { version = "0.33", default-features = true }
egui = "0.33"
egui_plot = "0.34"
rfd = "0.17"
gif = "0.14"
serde_json = "1"
lasso2 = { version = "0.8.2", features = ["multi-threaded", "serialize"] }
